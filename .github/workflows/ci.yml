name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Warnings are errors here, so the build stays warning-free.
      - name: Build
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test --configuration Release --no-build
          --logger trx --results-directory TestResults

      - name: Pack
        run: dotnet pack src/OpenXmlMailMerge --configuration Release --no-build --output artifacts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

      # Every document the tests merged, to open in Word.
      - name: Upload merged documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-documents-${{ matrix.os }}
          path: tests/OpenXmlMailMerge.Tests/bin/Release/net10.0/Output
          if-no-files-found: ignore
